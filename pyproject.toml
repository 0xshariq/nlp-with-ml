[project]
name = "nlp"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Sharique Chaudhary", email = "khanshariq92213@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "matplotlib>=3.11.1",
    "nltk>=3.10.3",
    "numpy>=2.4.6",
    "pandas>=3.0.5",
    "scikit-learn>=1.9.0",
    "scipy",
    "seaborn>=0.13.2",
    "sheryanalysis>=0.1.0",
    "streamlit>=1.63.0",
]

[project.scripts]
nlp = "nlp:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
